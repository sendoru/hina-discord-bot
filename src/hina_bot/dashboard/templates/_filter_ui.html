{% macro active_filter_chips(request, reset_url, data) -%}
{% set filters = applied_filters(data) %}
{% if filters %}
<div class="active-filter-bar" aria-label="Applied filters">
  <span class="active-filter-label">적용 조건</span>
  {% for key, value in filters.items() %}
    <a class="filter-chip" href="{{ remove_filter_url(reset_url, filters, key) }}" title="Remove {{ key }} filter">
      <span>{{ key | replace("_", " ") }}</span>
      <strong>{{ value }}</strong>
      <span aria-hidden="true">×</span>
    </a>
  {% endfor %}
  <a class="clear-filters" href="{{ reset_url }}">Clear all</a>
</div>
{% endif %}
{%- endmacro %}
