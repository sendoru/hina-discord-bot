<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}Hina Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='dashboard.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-branding">
        <a class="brand" href="/">
          <span class="brand-mark">H</span>
          <span class="brand-copy">
            <strong>Hina</strong>
            <small>Dashboard</small>
          </span>
        </a>
        <span class="badge">read-only</span>
      </div>

      <nav class="sidebar-nav" aria-label="Dashboard sections">
        <a class="nav-link nav-home {% if request.url.path == '/' %}active{% endif %}" href="/">
          <span>Overview</span>
        </a>

        <div class="nav-group">
          <span class="nav-group-label">Observability</span>
          <a class="nav-link {% if request.url.path.startswith('/traces') %}active{% endif %}" href="/traces">Traces</a>
          <a class="nav-link {% if request.url.path == '/analytics' %}active{% endif %}" href="/analytics">Analytics</a>
          <a class="nav-link {% if request.url.path == '/identity' %}active{% endif %}" href="/identity">Identity</a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Context</span>
          <a class="nav-link {% if request.url.path.startswith('/conversations') %}active{% endif %}" href="/conversations">Conversations</a>
          <a class="nav-link {% if request.url.path.startswith('/memory') and not request.url.path.startswith('/memory/cursors') %}active{% endif %}" href="/memory">Memory</a>
          <a class="nav-link {% if request.url.path == '/relationships' %}active{% endif %}" href="/relationships">Relationships</a>
          <a class="nav-link {% if request.url.path == '/state' %}active{% endif %}" href="/state">State</a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Memory ops</span>
          <a class="nav-link {% if request.url.path == '/summaries' %}active{% endif %}" href="/summaries">Summaries</a>
          <a class="nav-link {% if request.url.path == '/memory/cursors' %}active{% endif %}" href="/memory/cursors">Cursors</a>
          <a class="nav-link {% if request.url.path.startswith('/reconciliation') %}active{% endif %}" href="/reconciliation">Reconciliation</a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span class="sidebar-footer-label">Display timezone</span>
        <span class="timezone-badge">{{ dashboard_timezone }}</span>
      </div>
    </aside>

    <div class="workspace">
      <main class="container">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
