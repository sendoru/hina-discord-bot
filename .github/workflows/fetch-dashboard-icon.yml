name: Fetch dashboard icon asset

on:
  push:
    branches:
      - feat/dashboard-visual-refresh
    paths:
      - .github/workflows/fetch-dashboard-icon.yml

permissions:
  contents: write

jobs:
  fetch-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-visual-refresh
      - name: Download dashboard icon
        run: |
          mkdir -p src/hina_bot/dashboard/static
          curl --fail --location --retry 3             --user-agent 'Mozilla/5.0'             'https://cdn.discordapp.com/emojis/1542357433748426753.webp'             --output src/hina_bot/dashboard/static/hina-dashboard-icon.webp
          file src/hina_bot/dashboard/static/hina-dashboard-icon.webp
      - name: Commit asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hina_bot/dashboard/static/hina-dashboard-icon.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Add dashboard icon asset'
          git push origin HEAD:feat/dashboard-visual-refresh
