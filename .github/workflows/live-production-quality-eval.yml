name: Live production quality eval

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline branch, tag, or commit
        required: true
        default: main
      candidate_ref:
        description: Candidate branch, tag, or commit
        required: true
      repeat:
        description: Repeats per case
        required: true
        default: "1"
      fast_model:
        description: FAST Gemini model
        required: true
        default: gemini-3.5-flash-lite
      smart_model:
        description: SMART Gemini model
        required: true
        default: gemini-3.6-flash
      classifier_model:
        description: Routing classifier Gemini model
        required: true
        default: gemini-3.5-flash-lite
      smart_threshold:
        description: SMART routing threshold
        required: true
        default: "2.0"
      fast_thinking:
        description: FAST Gemini thinking level
        required: true
        default: minimal
      smart_thinking:
        description: SMART Gemini thinking level
        required: true
        default: medium
      baseline_channel_context_chars:
        description: Baseline eval-only channel context char budget
        required: true
        default: "6000"
      candidate_channel_context_chars:
        description: Candidate eval-only channel context char budget
        required: true
        default: "4000"
      history_max_chars:
        description: Shared eval history max chars
        required: true
        default: "12000"
      lore_max_chars:
        description: Shared eval lore max chars
        required: true
        default: "3200"
      lore_max_items:
        description: Shared eval lore max items
        required: true
        default: "6"

permissions:
  contents: read

concurrency:
  group: live-production-quality-eval-${{ github.actor }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CHAT_WEB_SEARCH: "false"
      COMMUNITY_LORE: "true"
      MAX_OUTPUT_TOKENS: "4096"

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate inputs
        env:
          REPEAT: ${{ inputs.repeat }}
          SMART_THRESHOLD: ${{ inputs.smart_threshold }}
          BASELINE_CHANNEL_CONTEXT_CHARS: ${{ inputs.baseline_channel_context_chars }}
          CANDIDATE_CHANNEL_CONTEXT_CHARS: ${{ inputs.candidate_channel_context_chars }}
          HISTORY_MAX_CHARS_INPUT: ${{ inputs.history_max_chars }}
          LORE_MAX_CHARS_INPUT: ${{ inputs.lore_max_chars }}
          LORE_MAX_ITEMS_INPUT: ${{ inputs.lore_max_items }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || {
            echo "GEMINI_API_KEY repository secret is missing." >&2
            exit 1
          }
          test -f control/evals/suites/production-quality.txt
          test -f control/evals/production_quality_cases.jsonl
          [[ "$REPEAT" =~ ^[1-9][0-9]*$ ]] || {
            echo "repeat must be a positive integer." >&2
            exit 1
          }
          python - <<'PY'
          import os

          value = float(os.environ["SMART_THRESHOLD"])
          if not 0.1 <= value <= 10.0:
              raise SystemExit("smart_threshold must be between 0.1 and 10.0")

          for name in (
              "BASELINE_CHANNEL_CONTEXT_CHARS",
              "CANDIDATE_CHANNEL_CONTEXT_CHARS",
              "HISTORY_MAX_CHARS_INPUT",
              "LORE_MAX_CHARS_INPUT",
              "LORE_MAX_ITEMS_INPUT",
          ):
              raw = os.environ[name]
              if not raw.isdigit() or int(raw) <= 0:
                  raise SystemExit(f"{name.lower()} must be a positive integer")
          PY
          mkdir -p results
          cp control/evals/production_quality_cases.jsonl results/cases.jsonl

      - name: Install baseline
        run: python -m pip install -e ./baseline

      - name: Run baseline adaptive
        working-directory: baseline
        env:
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -euo pipefail
          mapfile -t CASE_IDS < <(
            grep -Ev '^[[:space:]]*(#|$)' ../control/evals/suites/production-quality.txt
          )
          ID_ARGS=()
          for case_id in "${CASE_IDS[@]}"; do
            ID_ARGS+=(--id "$case_id")
          done
          python -m hina_bot.tooling.eval_runner \
            --cases ../control/evals/production_quality_cases.jsonl \
            --provider gemini \
            --routing-mode adaptive \
            --fast-model "${{ inputs.fast_model }}" \
            --smart-model "${{ inputs.smart_model }}" \
            --smart-threshold "${{ inputs.smart_threshold }}" \
            --routing-classifier-mode active \
            --routing-classifier-provider gemini \
            --routing-classifier-model "${{ inputs.classifier_model }}" \
            --gemini-fast-thinking-level "${{ inputs.fast_thinking }}" \
            --gemini-smart-thinking-level "${{ inputs.smart_thinking }}" \
            --eval-channel-context-chars "${{ inputs.baseline_channel_context_chars }}" \
            --history-max-chars "${{ inputs.history_max_chars }}" \
            --lore-max-chars "${{ inputs.lore_max_chars }}" \
            --lore-max-items "${{ inputs.lore_max_items }}" \
            --repeat "$REPEAT" \
            --usage-log ../results/baseline-adaptive-usage.jsonl \
            --output ../results/baseline-adaptive.jsonl \
            "${ID_ARGS[@]}"

      - name: Install candidate
        run: python -m pip install -e ./candidate

      - name: Run candidate adaptive
        working-directory: candidate
        env:
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -euo pipefail
          mapfile -t CASE_IDS < <(
            grep -Ev '^[[:space:]]*(#|$)' ../control/evals/suites/production-quality.txt
          )
          ID_ARGS=()
          for case_id in "${CASE_IDS[@]}"; do
            ID_ARGS+=(--id "$case_id")
          done
          python -m hina_bot.tooling.eval_runner \
            --cases ../control/evals/production_quality_cases.jsonl \
            --provider gemini \
            --routing-mode adaptive \
            --fast-model "${{ inputs.fast_model }}" \
            --smart-model "${{ inputs.smart_model }}" \
            --smart-threshold "${{ inputs.smart_threshold }}" \
            --routing-classifier-mode active \
            --routing-classifier-provider gemini \
            --routing-classifier-model "${{ inputs.classifier_model }}" \
            --gemini-fast-thinking-level "${{ inputs.fast_thinking }}" \
            --gemini-smart-thinking-level "${{ inputs.smart_thinking }}" \
            --eval-channel-context-chars "${{ inputs.candidate_channel_context_chars }}" \
            --history-max-chars "${{ inputs.history_max_chars }}" \
            --lore-max-chars "${{ inputs.lore_max_chars }}" \
            --lore-max-items "${{ inputs.lore_max_items }}" \
            --repeat "$REPEAT" \
            --usage-log ../results/candidate-adaptive-usage.jsonl \
            --output ../results/candidate-adaptive.jsonl \
            "${ID_ARGS[@]}"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Live production quality eval"
            echo
            printf -- '- baseline: `%s`\n' "${{ inputs.baseline_ref }}"
            printf -- '- candidate: `%s`\n' "${{ inputs.candidate_ref }}"
            printf -- '- FAST: `%s` / `%s`\n' "${{ inputs.fast_model }}" "${{ inputs.fast_thinking }}"
            printf -- '- SMART: `%s` / `%s`\n' "${{ inputs.smart_model }}" "${{ inputs.smart_thinking }}"
            printf -- '- classifier: `%s`\n' "${{ inputs.classifier_model }}"
            printf -- '- threshold: `%s`\n' "${{ inputs.smart_threshold }}"
            printf -- '- channel context chars: baseline=`%s`, candidate=`%s`\n' "${{ inputs.baseline_channel_context_chars }}" "${{ inputs.candidate_channel_context_chars }}"
            printf -- '- history max chars: `%s`\n' "${{ inputs.history_max_chars }}"
            printf -- '- lore: max chars=`%s`, max items=`%s`\n' "${{ inputs.lore_max_chars }}" "${{ inputs.lore_max_items }}"
            echo
            echo "Each Markdown report includes the actual model/tier chosen per turn."
            echo "Quality PASS/FAIL remains a manual review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-quality-eval-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
