[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hina-discord-bot"
version = "0.1.0"
description = "Hina roleplay Discord bot with isolated persistent memory and OpenAI Responses API"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.7,<3", "openai>=1.68,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "httpx>=0.27,<1"]

[project.scripts]
hina-bot = "hina_bot.discord.runtime_entry:main"
hina-lore = "hina_bot.tooling.lore_cli:main"
hina-eval = "hina_bot.tooling.eval_runner:main"
hina-migrate-runtime = "hina_bot.core.runtime_migration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hina_bot = ["prompts/*.md", "data/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
